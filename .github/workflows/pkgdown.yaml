# Builds the pkgdown website on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://yan-lab-msu.github.io/SigDoTS/ once Pages is enabled
# for the repository (Settings -> Pages -> branch gh-pages), when the repository is public.
# It can also be started by hand (workflow_dispatch), to rebuild only the site.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # Seurat, SpatialExperiment, scuttle and scran: the own-data tutorial runs its Seurat
          # and SpatialExperiment examples only when they are installed; without them the page
          # showed those examples' code but not their output (found 2026-11-02).
          extra-packages: any::pkgdown, any::knitr, any::rmarkdown, any::Seurat, any::SpatialExperiment, any::scuttle, any::scran, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
