# url: https://yan-lab-msu.github.io/SigDoTS/   # the planned address (manuscript, Code Availability); set when the repository is public
template:
  bootstrap: 5

# Every plot on the website (tutorials and the examples of the help pages) is a vector graphic
# (SVG, R's own cairo-based svg() device, which draws text as outlines), sharp at any zoom
# (2026-11-04). svglite was tried first: pkgdown 2.0.7 gives the examples' device bg = NA,
# which svglite refuses ("Expected string vector of length 1").
figures:
  dev: grDevices::svg
  fig.ext: svg
  bg: white

home:
  title: "SigDoTS: significance testing for spatial domains"
  description: >
    Tests whether the spatial domains found in a spatial transcriptomics sample are
    supported by the data, with a single-domain null model that keeps the spatial
    correlation of the noise and the gene-gene covariance.
  sidebar: FALSE   # no right-hand column: the text spans the page (pkgdown/extra.css)

# The navbar has no search box, no version and no right-hand items; the footer is empty. The home
# page is the README (its header image with the title and the logo on top) at the full width of
# the page, with no right-hand column. These are set in pkgdown/extra.css (hidden by CSS where
# pkgdown 2.0.7 has no setting), by `home: sidebar: FALSE` and by the two blank footer
# components below. No "Get started" tab: it opened the same page as the Tutorials menu's first
# entry (removed 2026-11-04). No Changelog tab while there is only the first version (NEWS.md
# stays in the package; add `news` back to `left` with the next version).
navbar:
  structure:
    left: [tutorials, method, reference]
    right: []
  components:
    tutorials:
      text: Tutorials
      menu:
      - text: Getting started (simulated data)
        href: articles/SigDoTS.html
      - text: Real data application (human cortex, Visium)
        href: articles/dlpfc.html
      - text: Using SigDoTS on your own data
        href: articles/own-data.html
      - text: Troubleshooting and FAQ
        href: articles/faq.html
    method:
      text: Method
      href: articles/how-it-works.html
    reference:
      text: Documentation
      menu:
      - text: Reference manual
        href: articles/reference-manual.html
      - text: Reference manual (PDF)
        href: SigDoTS-manual.pdf

footer:
  structure:
    left: blank
    right: blank
  components:
    blank: ""

reference:
- title: Run SigDoTS
  desc: >
    `sigdots()` runs the whole analysis and returns the result; `sigdots_control()` holds the
    settings that rarely need changing. Each page below explains the function, every argument
    with its allowed values and default, and what is returned.
  contents:
  - sigdots
  - sigdots_control
- title: Prepare the input
  desc: >
    `sigdots()` takes a normalised expression matrix with coordinates, a Seurat object or a
    SpatialExperiment object directly. From raw counts, `sigdots_prepare()` makes the matrix.
  contents:
  - sigdots_prepare
- title: Read the result
  desc: >
    What `print()` and `summary()` show and how to read the split tree and the tests table;
    the domain of every spot as a table or written back into your object; the plots.
  contents:
  - summary.sigdots
  - domains
  - add_domains
  - plot.sigdots
- title: Example data
  contents:
  - sigdots_example
- title: Overview
  contents:
  - SigDoTS-package

articles:
- title: Tutorials
  navbar: ~
  contents:
  - SigDoTS
  - articles/dlpfc
  - own-data
  - faq
- title: Method
  navbar: ~
  contents:
  - how-it-works
- title: Documentation
  navbar: ~
  contents:
  - articles/reference-manual

news:
  one_page: true
